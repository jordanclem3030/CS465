
<main class="container mt-4">

  <h1 class="text-center mb-4">
    {{ title }}
  </h1>

  <!-- Show login screen when logged out -->
  <app-login
    *ngIf="!isLoggedIn"
    (loginSuccess)="onLoginSuccess()">
  </app-login>

  <!-- Show admin features when logged in -->
  <div *ngIf="isLoggedIn">

    <div class="text-end mb-3">
      <button
        class="btn btn-danger"
        (click)="logout()">
        Logout
      </button>
    </div>

    <app-trip-listing></app-trip-listing>

    <hr class="my-5">

    <app-add-trip></app-add-trip>

  </div>

</main>
