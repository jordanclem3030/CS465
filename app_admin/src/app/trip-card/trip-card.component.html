
<div class="card h-100">
  <div class="card-body">
    <h5 class="card-title">{{ trip.name }}</h5>

    <p class="card-text">
      <strong>Code:</strong> {{ trip.code }}
    </p>

    <p class="card-text">
      <strong>Duration:</strong> {{ trip.length }}
    </p>

    <p class="card-text">
      <strong>Start Date:</strong> {{ trip.start }}
    </p>

    <p class="card-text">
      <strong>Resort:</strong> {{ trip.resort }}
    </p>

    <p class="card-text">
      <strong>Price:</strong> ${{ trip.perPerson }}
    </p>
  </div>
</div>
